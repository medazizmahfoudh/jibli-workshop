# in-memory H2 database: nothing to install, the data disappears when the app stops
spring.datasource.url=jdbc:h2:mem:jibli
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the entities, and prints the SQL it runs
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# browser console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
